  <style>html,body{background:#07120e}#splash{z-index:1000;background:#07120e;transition:opacity .45s;position:fixed;inset:0;overflow:hidden}#splash.done{opacity:0;pointer-events:none}.sp-bg{will-change:transform;background:url(/readlab/splash-bg.webp) 50%/cover no-repeat;position:absolute;inset:-7%}.sp-base{animation:2.6s both sp-base}.sp-green{mix-blend-mode:screen;opacity:0;animation:2.6s both sp-green;-webkit-mask-image:radial-gradient(70% 55% at 15% 12%,#000 30%,#0000 75%);mask-image:radial-gradient(70% 55% at 15% 12%,#000 30%,#0000 75%)}.sp-violet{mix-blend-mode:screen;opacity:0;animation:2.6s both sp-violet;-webkit-mask-image:radial-gradient(65% 45% at 95% 82%,#000 25%,#0000 72%);mask-image:radial-gradient(65% 45% at 95% 82%,#000 25%,#0000 72%)}@keyframes sp-base{0%{transform:scale(1.09)translate(-2%,-1.4%)}to{transform:scale(1.01)translate(.4%,.3%)}}@keyframes sp-green{0%{opacity:0;transform:scale(1.1)translate(-3.5%,-2.5%)}45%{opacity:.34}to{opacity:.2;transform:scale(1.02)translate(1%,.8%)}}@keyframes sp-violet{0%{opacity:0;transform:scale(1.1)translate(3.5%,2.5%)}55%{opacity:.38}to{opacity:.22;transform:scale(1.02)translate(-1%,-.8%)}}.sp-logo{opacity:0;border-radius:25px;width:112px;height:112px;margin:-56px 0 0 -56px;animation:.55s cubic-bezier(.2,.8,.2,1) .2s forwards sp-logo,1.6s ease-in-out .75s both sp-light;position:absolute;top:50%;left:50%;transform:scale(.96);box-shadow:0 18px 44px -14px #000000bf}@keyframes sp-logo{to{opacity:1;transform:scale(1)}}@keyframes sp-light{0%,to{filter:brightness()}50%{filter:brightness(1.06)}}.sp-word{text-align:center;letter-spacing:.45em;color:#b0ddc0;opacity:0;padding-left:.45em;font:500 11px/1 -apple-system,system-ui,sans-serif;animation:.5s .45s forwards sp-word;position:absolute;top:calc(50% + 74px);left:0;right:0}@keyframes sp-word{to{opacity:.8}}@media (prefers-reduced-motion:reduce){.sp-bg,.sp-logo,.sp-word{animation:none!important}.sp-green,.sp-violet{display:none}.sp-logo{opacity:1;transform:none}.sp-word
